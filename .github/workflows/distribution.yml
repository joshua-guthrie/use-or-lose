name: Distribution

on:
  # Builds and releases are on demand: dispatch with a release version.
  # to publish a desktop release, or run a development artifact validation.
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.0). Empty builds a development artifact without publishing.'
        required: false
        default: ''
      make_release:
        description: 'Publish a GitHub release with the desktop installers (no Android artifacts)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: package metadata
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      numeric-version: ${{ steps.version.outputs.numeric-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          release_version="${{ github.event.inputs.release_version }}"
          if [[ -n "$release_version" ]]; then
            package_version="$release_version"
          else
            package_version="$(python installer/package.py version --development --sha "$GITHUB_SHA")"
          fi
          numeric_version="$(python installer/package.py numeric-version --version "$package_version")"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "numeric-version=$numeric_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: metadata
    runs-on: windows-latest
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
      NUMERIC_VERSION: ${{ needs.metadata.outputs.numeric-version }}
      FEDLEAVE_BUILD_VERSION: ${{ needs.metadata.outputs.package-version }}
      FEDLEAVE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The Windows 3.11 binary selected by setup-python lacks private mkdir ACLs.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build PyInstaller applications
        shell: cmd
        run: scripts\WindowsInstall.bat --unattended --build-only --verbose

      - name: Verify complete Windows bundle
        run: python installer/package.py validate-bundle --platform windows --bundle-dir dist/use-or-lose-Windows

      - name: Check resolved Windows build and runtime advisories
        run: |
          python -m pip install "pip-audit>=2.10,<3"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r dist/use-or-lose-Windows/DEPENDENCIES.txt

      - name: Remove duplicate build workspace
        shell: pwsh
        run: Remove-Item -Recurse -Force .build

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $PWD "artifacts"
          $sourceDir = Join-Path $PWD "dist\use-or-lose-Windows"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          # Chocolatey updates the machine PATH after this job has already
          # started, so use its deterministic install path in the next step.
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis -ErrorAction Stop).Source
          }
          & $makensis `
            "/DVERSION=$env:PACKAGE_VERSION" `
            "/DNUMERIC_VERSION=$env:NUMERIC_VERSION" `
            "/DSOURCE_DIR=$sourceDir" `
            "/DOUTPUT_DIR=$artifactDir" `
            "installer\windows\UseOrLose.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed with exit code $LASTEXITCODE" }
          $installer = Join-Path $artifactDir "UseOrLose-Setup-$env:PACKAGE_VERSION-Windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "NSIS did not create $installer" }
          python installer/package.py checksum $installer

      - name: Silent install, CLI, uninstall, and data-preservation smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $PWD "artifacts\UseOrLose-Setup-$env:PACKAGE_VERSION-Windows-x64.exe"
          $installDir = Join-Path $env:ProgramFiles "UseOrLose"
          $userDataDir = Join-Path $env:LOCALAPPDATA "use-or-lose"
          $sentinel = Join-Path $userDataDir "ci-user-data-preserved.txt"
          New-Item -ItemType Directory -Force -Path $userDataDir | Out-Null
          Set-Content -Path $sentinel -Value "must survive install and uninstall"

          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installation failed: $($install.ExitCode)" }
          python installer/package.py validate-bundle --platform windows --bundle-dir $installDir
          & "$installDir\use-or-lose.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI smoke test failed" }
          python -m pip install "mcp==2.3.0"
          python scripts/lib/common/mcp_smoke.py --server "$installDir\use-or-lose-mcp.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed MCP stdio read/write smoke test failed" }

          $uninstall = Start-Process -FilePath "$installDir\Uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path $installDir); $attempt++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path $installDir) { throw "Application files remain after uninstall: $installDir" }
          if (-not (Test-Path $sentinel)) { throw "Uninstall incorrectly removed user data: $sentinel" }

      - uses: actions/upload-artifact@v4
        with:
          name: use-or-lose-windows-${{ needs.metadata.outputs.package-version }}
          path: |
            artifacts/UseOrLose-Setup-*-Windows-x64.exe
            artifacts/UseOrLose-Setup-*-Windows-x64.exe.sha256
          if-no-files-found: error

  linux:
    name: Linux package
    needs: metadata
    # Build against the oldest supported libc, never the moving -latest image.
    runs-on: ubuntu-22.04
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
      FEDLEAVE_BUILD_VERSION: ${{ needs.metadata.outputs.package-version }}
      FEDLEAVE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 shellcheck binutils acl
          chmod +x scripts/LinuxInstall.sh installer/linux/install.sh installer/package.py

      - name: Verify system installation permissions in an isolated directory
        run: |
          python -m pip install pytest
          sudo env FEDLEAVE_TEST_UID="$(id -u)" FEDLEAVE_TEST_GID="$(id -g)" \
            "$(command -v python)" -m pytest -q tests/test_linux_system_install_security.py

      - name: Build PyInstaller applications
        run: ./scripts/LinuxInstall.sh --unattended --build-only --verbose

      - name: Verify complete Linux bundle
        run: python installer/package.py validate-bundle --platform linux --bundle-dir dist/use-or-lose-Ubuntu

      - name: Enforce Linux GLIBC compatibility baseline
        run: python installer/package.py audit-linux-abi --bundle-dir dist/use-or-lose-Ubuntu --max-glibc 2.35

      - name: Check resolved Linux build and runtime advisories
        run: |
          python -m pip install "pip-audit>=2.10,<3"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r dist/use-or-lose-Ubuntu/DEPENDENCIES.txt

      - name: Remove duplicate build workspace
        run: rm -rf .build

      - name: Create archive and checksum
        run: |
          python installer/package.py linux-archive \
            --bundle-dir dist/use-or-lose-Ubuntu \
            --output-dir artifacts \
            --version "$PACKAGE_VERSION"
          archive="artifacts/UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz"
          python installer/package.py check-size "$archive" --max-mib 300
          archive_size="$(du -h "$archive" | cut -f1)"
          printf '### Linux installer size\n\n- Compressed archive: %s\n- Enforced limit: 300 MiB\n' \
            "$archive_size" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate extracted archive and CLI
        run: |
          set -Eeuo pipefail
          extract_dir="$(mktemp -d)"
          tar -xzf "artifacts/UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz" -C "$extract_dir"
          python installer/package.py validate-bundle --platform linux --bundle-dir "$extract_dir/UseOrLose"
          "$extract_dir/UseOrLose/use-or-lose" --version

      - name: Validate and exercise bootstrap installer
        run: |
          set -Eeuo pipefail
          shellcheck installer/linux/install.sh
          install_root="$RUNNER_TEMP/use-or-lose-bootstrap"
          bin_dir="$RUNNER_TEMP/use-or-lose-bin"
          rolling_dir="$RUNNER_TEMP/use-or-lose-stable-assets"
          mkdir "$rolling_dir"
          cp "artifacts/UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz" \
            "$rolling_dir/UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz"
          (
            cd "$rolling_dir"
            sha256sum "UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz" \
              > "UseOrLose-${PACKAGE_VERSION}-Linux-x86_64.tar.gz.sha256"
          )
          installer/linux/install.sh \
            --unattended \
            --version "$PACKAGE_VERSION" \
            --asset-base-url "file://$rolling_dir" \
            --install-root "$install_root" \
            --bin-dir "$bin_dir"
          "$bin_dir/use-or-lose" --version
          python -m pip install "mcp==2.3.0"
          python scripts/lib/common/mcp_smoke.py --server "$bin_dir/use-or-lose-mcp"
          test -L "$install_root/current"

      - uses: actions/upload-artifact@v4
        with:
          name: use-or-lose-linux-${{ needs.metadata.outputs.package-version }}
          path: |
            artifacts/UseOrLose-*-Linux-x86_64.tar.gz
            artifacts/UseOrLose-*-Linux-x86_64.tar.gz.sha256
            installer/linux/install.sh
          if-no-files-found: error

  linux-compatibility:
    name: Released Linux runtime (${{ matrix.image }})
    needs: [metadata, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: use-or-lose-linux-${{ needs.metadata.outputs.package-version }}
          path: artifacts
      - name: Launch released applications on independent older userspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" "${{ matrix.image }}" bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libx11-6 libxext6 libxrender1 libxcb1 fonts-dejavu-core
            python3 /work/scripts/lib/common/linux_runtime_smoke.py --archive-dir /work/artifacts
          '

  release:
    name: Publish desktop release
    if: github.event.inputs.make_release == 'true'
    needs: [metadata, windows, linux, linux-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: use-or-lose-*
          path: release-assets
          merge-multiple: true

      - name: Prepare desktop release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir release
          windows_installer=$(find release-assets -type f -name 'UseOrLose-Setup-*-Windows-x64.exe' -print)
          linux_archive=$(find release-assets -type f -name 'UseOrLose-*-Linux-x86_64.tar.gz' -print)
          [[ -n "$windows_installer" ]] && [[ -n "$linux_archive" ]] || {
            echo "Missing desktop artifacts" >&2
            exit 1
          }
          cp "$windows_installer" release/
          cp "${windows_installer}.sha256" release/
          cp "$linux_archive" release/
          cp "${linux_archive}.sha256" release/
          cp installer/linux/install.sh release/install.sh

      - name: Create the release (desktop only, no Android artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git rev-parse "v$PACKAGE_VERSION" >/dev/null 2>&1; then
            git tag "v$PACKAGE_VERSION"
            git push origin "v$PACKAGE_VERSION"
          fi
          gh release create "v$PACKAGE_VERSION" \
            --title "Use or Lose $PACKAGE_VERSION" \
            --notes "Desktop release of Use or Lose $PACKAGE_VERSION. Android artifacts are not part of this release." \
            --target "$SOURCE_COMMIT" \
            release/UseOrLose-Setup-*-Windows-x64.exe \
            release/UseOrLose-Setup-*-Windows-x64.exe.sha256 \
            release/UseOrLose-*-Linux-x86_64.tar.gz \
            release/UseOrLose-*-Linux-x86_64.tar.gz.sha256 \
            release/install.sh

      - name: Update the committed build pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Only the tiny BUILD.txt is version controlled; the installer
          # binaries live on the release and never enter the repository.
          printf 'source_commit=%s\nversion=%s\n' \
            "$SOURCE_COMMIT" "$PACKAGE_VERSION" > installers/BUILD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/BUILD.txt
          if git diff --cached --quiet; then
            echo "BUILD.txt unchanged; nothing to commit."
          else
            git commit -m "Record published build $PACKAGE_VERSION"
            git push origin HEAD:master
          fi
