# Packaging metadata for scripts defined in pyproject.toml [project.scripts].
# Any new script added to pyproject.toml must have a matching section here.

[use-or-lose]
mode = "console"
hidden_imports = ["useorlose", "holidays", "icalendar"]
collect_all = ["useorlose"]

[use-or-lose-mcp]
mode = "console"
hidden_imports = ["useorlose.cli", "mcp.server.lowlevel", "mcp.server.stdio", "portalocker"]
collect_all = ["mcp", "mcp_types", "jsonschema_specifications", "portalocker"]

[UseOrLoseCalendar]
mode = "windowed"
icon = "assets/use-or-lose-icon.ico"
add_data = ["help:help", "assets:assets"]
hidden_imports = [
  "PySide6.QtCore",
  "PySide6.QtGui",
  "PySide6.QtWidgets",
  "PySide6.QtPrintSupport",
  "shiboken6",
  "shiboken6.Shiboken",
]

[UseOrLoseAnalytics]
mode = "windowed"
icon = "assets/use-or-lose-icon.ico"
hidden_imports = ["PySide6.QtCore", "PySide6.QtGui", "PySide6.QtWidgets", "PySide6.QtPrintSupport", "shiboken6", "shiboken6.Shiboken"]
collect_all = ["useorlose_analytics"]

